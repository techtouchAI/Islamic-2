name: Build Android APK

on:
  push:
    branches: [ main, "feat/**", "fix/**", "feature/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

          # إعداد بيئة جافا لإصدار النظم
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

          # إعداد بيئة فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

          # تثبيت مكتبات بايثون لمعالجة الصور
      - name: Install Python dependencies
        run: pip3 install Pillow

          # تحديث ملفات التطبيق والصوتيات من نظام إدارة المحتوى
      - name: Update App Resources from CMS (Icons & Audio)
        run: python3 scripts/update_resources.py

          # تحميل حزم مكتبات فلاتر
      - name: Install dependencies
        run: flutter pub get

          # بناء التطبيق مع تفعيل التشفير وزيادة رقم الإصدار برمجياً لضمان التثبيت فوق النسخ القديمة
      - name: Build APK (64-bit architecture with Obfuscation & Auto-Increment)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --build-number=${{ github.run_number }}
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

          # رفع ملفات الـ APK الناتجة إلى مستودع جيت هاب لغرض التحميل
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aldhakereen-apks
          path: build/app/outputs/flutter-apk/*.apk
